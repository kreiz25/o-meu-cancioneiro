<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="56" y1="40" x2="460" y2="492" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a9c79"/>
      <stop offset=".55" stop-color="#11674f"/>
      <stop offset="1" stop-color="#073e3b"/>
    </linearGradient>
    <linearGradient id="body" x1="157" y1="236" x2="359" y2="460" gradientUnits="userSpaceOnUse">
